name: fetch-video

on:
  push:
    paths:
      - '.fetch-video-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --upgrade yt-dlp faster-whisper
          echo ok

      - name: Download video
        run: |
          mkdir -p out
          URL=$(grep -o 'https://[^ ]*' .fetch-video-trigger | head -1)
          yt-dlp --no-playlist --write-info-json --write-thumbnail \
                 -f "bv*[height<=720]+ba/b[height<=720]" --merge-output-format mp4 \
                 -o "out/video.%(ext)s" "$URL" 2>&1 | tail -5
          ls -la out/

      - name: Metadata + transcript
        run: |
          mkdir -p analysis
          python - <<'PY'
          import json, glob
          j = json.load(open(glob.glob('out/video.info.json')[0]))
          keep = ["id","title","uploader","uploader_id","channel","duration","view_count",
                  "like_count","upload_date","description","chapters","tags"]
          d = {k: j.get(k) for k in keep}
          open('analysis/video-info.json','w').write(json.dumps(d, indent=2, ensure_ascii=False))
          print(d.get('title'), '|', d.get('duration'))
          PY
          ffmpeg -v error -i out/video.mp4 -vn -ac 1 -ar 16000 -c:a aac out/audio.m4a -y
          python - <<'PY'
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          segs, info = m.transcribe("out/audio.m4a", beam_size=1, vad_filter=True)
          lines = []
          for s in segs:
              lines.append(f"[{int(s.start//60):02d}:{int(s.start%60):02d}] {s.text.strip()}")
          open('analysis/transcript.txt','w').write("\n".join(lines))
          print(len(lines), "segments")
          PY

      - name: Frames + short clip
        run: |
          ffmpeg -v error -i out/video.mp4 -vf "fps=1/40,scale=420:-1,tile=4x4" -frames:v 3 analysis/sheet_%02d.jpg -y
          ffmpeg -v error -ss 0 -t 45 -i out/video.mp4 -vf "scale=480:-2" -c:v libx264 -crf 32 -preset veryfast -c:a aac -b:a 48k analysis/clip-0-45s.mp4 -y
          du -sh analysis; ls -la analysis

      - name: Push report back to branch
        if: always()
        run: |
          git config user.name "arena-agent"; git config user.email "agent@arena.local"
          git add analysis
          git diff --cached --quiet || git commit -m "ci: video analysis report [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
