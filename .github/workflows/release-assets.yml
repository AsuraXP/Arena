name: release-assets

on:
  push:
    paths:
      - '.release-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: ls -lh demo/out.mp4 demo3/out.mp4 demo/site/demo-720.mp4 demo/site/demo2-720.mp4

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view demo-v1 >/dev/null 2>&1 || \
            gh release create demo-v1 --title "What-If Animation — no ElevenLabs" \
              --notes "Same script as the tutorial's \"what if you never needed to sleep\" episode, built without ElevenLabs.

          **v1 — stills + camera moves** (AI art, Ken Burns motion)
          **v2 — fully procedural** (every frame drawn in code: walk cycles, waving figure, pulsing jellyfish, parallax city)"
          cp demo/out.mp4                       what-if-v1-1080p.mp4
          cp demo/site/demo-720.mp4             what-if-v1-720p.mp4
          cp demo3/out.mp4                      what-if-v2-animated-1080p.mp4
          cp demo/site/demo2-720.mp4            what-if-v2-animated-720p.mp4
          cp demo/site/storyboard.jpg           storyboard.jpg
          cp demo4/hero-shot.mp4                what-if-v3-hero-shot.mp4
          for f in *.mp4 storyboard.jpg; do
            gh release upload demo-v1 "$f" --clobber
          done
          gh release view demo-v1 --json assets --jq '.assets[] | "\(.name)  \(.size)"'
